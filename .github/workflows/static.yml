name: Deploy Vite Site to Pages

on:
  push:
    branches: ["master"] # <-- Đã sửa thành master chuẩn theo repo của bạn

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # <-- Dùng Node 22 mới nhất để không bị cảnh báo màu vàng
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dự án
        run: npx vite build # <-- Bỏ qua check lỗi TypeScript nghiêm ngặt để ép build ra file tĩnh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
